import_ip_log:
  name: Import external IP log
  description: >-
    Import external IP history from a CSV file — one "date,ip" pair per line,
    e.g. "2026-01-05 09:30:00,203.0.113.7". Imported rows merge with the
    existing log by date and consecutive duplicate IPs collapse, so running it
    twice is safe. The file must be inside the Home Assistant configuration
    directory. Requires external IP change logging to be enabled.
  fields:
    path:
      name: File path
      description: Path to the CSV file.
      required: true
      example: "/config/my_ip_history.csv"
      selector:
        text:

set_path:
  name: Set connection path
  description: >-
    Pin a device's connection path by hand — for devices nothing can observe,
    such as clients of an access point this integration cannot poll. The pin
    survives restarts and outranks whatever scanning and router polling would
    say, until it is cleared by setting the path back to "auto". The device
    table card offers this from the Path column, too.
  fields:
    mac:
      name: MAC address
      description: >-
        MAC address of the device (or "ip:<address>" for a device whose MAC
        is not known).
      required: true
      example: "aa:bb:cc:dd:ee:ff"
      selector:
        text:
    path:
      name: Path
      description: The path to pin, or "auto" to clear the pin.
      required: true
      example: "5 GHz"
      selector:
        select:
          options:
            - "auto"
            - "LAN"
            - "2.4 GHz"
            - "5 GHz"
            - "6 GHz"
            - "Guest"
            - "Wi-Fi"
            - "Access point"
            - "Router"

forget_device:
  name: Forget device
  description: >-
    Remove a device from the integration's persistent memory of seen devices.
    If the device is still on the network it reappears on the next scan with a
    fresh history; use this to clean up stale offline entries.
  fields:
    mac:
      name: MAC address
      description: MAC address of the device to forget.
      required: true
      example: "aa:bb:cc:dd:ee:ff"
      selector:
        text:
